<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドラゴンズ ネタ帳</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dragons">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Hiragino Sans', sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  a.back-link {
    align-self: flex-start;
    max-width: 640px;
    width: 100%;
    margin: 0 auto 12px;
    font-size: 0.8rem;
    color: #6b7280;
    text-decoration: none;
  }

  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 12px;
  }

  header h1 {
    font-size: 1.2rem;
    font-weight: 700;
    color: #0c2340;
  }

  header h1 span.badge-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e4002b;
    margin-right: 8px;
  }

  .refresh-btn {
    background: #0c2340;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }
  .refresh-btn:active { opacity: 0.8; }

  .status-line {
    width: 100%;
    max-width: 640px;
    font-size: 0.75rem;
    color: #9ca3af;
    margin-bottom: 16px;
  }

  .filter-tabs {
    width: 100%;
    max-width: 640px;
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  .filter-tab {
    flex-shrink: 0;
    background: #fff;
    border: 1px solid #e5e7eb;
    color: #6b7280;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .filter-tab.active {
    background: #0c2340;
    border-color: #0c2340;
    color: #fff;
  }

  .day-group {
    width: 100%;
    max-width: 640px;
    margin-bottom: 22px;
  }
  .day-group h2 {
    font-size: 0.78rem;
    color: #9ca3af;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
    padding-left: 2px;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    margin-bottom: 12px;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .headline {
    font-size: 0.95rem;
    font-weight: 700;
    color: #111827;
    line-height: 1.4;
  }

  .status-badge {
    flex-shrink: 0;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-proposed { background: #eef2ff; color: #4338ca; }
  .status-accepted { background: #ecfdf5; color: #047857; }
  .status-posted   { background: #fdf4ff; color: #a21caf; }
  .status-rejected { background: #f3f4f6; color: #9ca3af; }

  .draft-box {
    background: #f8f9fb;
    border: 1px solid #eef0f3;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.86rem;
    line-height: 1.65;
    color: #1f2937;
    white-space: pre-wrap;
    margin-bottom: 10px;
  }

  .card-meta {
    font-size: 0.76rem;
    color: #9ca3af;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .card-meta b { color: #6b7280; }

  .card-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .copy-btn {
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .copy-btn.copied { background: #059669; }

  .source-link {
    font-size: 0.74rem;
    color: #9ca3af;
    text-decoration: none;
  }
  .source-link:hover { text-decoration: underline; }

  .critic-note {
    font-size: 0.76rem;
    color: #9ca3af;
    line-height: 1.6;
    border-top: 1px dashed #eef0f3;
    margin-top: 10px;
    padding-top: 10px;
  }

  .empty-state, .loading-state {
    width: 100%;
    max-width: 640px;
    text-align: center;
    color: #9ca3af;
    font-size: 0.85rem;
    padding: 60px 0;
  }
</style>
</head>
<body>

  <a class="back-link" href="../">← ダッシュボードに戻る</a>

  <header>
    <h1><span class="badge-dot"></span>ドラゴンズ ネタ帳</h1>
    <button class="refresh-btn" id="refreshBtn" onclick="loadLog()">↺ ネタ出し</button>
  </header>
  <div class="status-line" id="statusLine"></div>

  <div class="filter-tabs" id="filterTabs">
    <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">すべて</button>
    <button class="filter-tab" data-filter="proposed" onclick="setFilter('proposed')">提案中</button>
    <button class="filter-tab" data-filter="accepted" onclick="setFilter('accepted')">採用</button>
    <button class="filter-tab" data-filter="posted" onclick="setFilter('posted')">投稿済み</button>
    <button class="filter-tab" data-filter="rejected" onclick="setFilter('rejected')">却下</button>
  </div>

  <div id="content">
    <div class="loading-state">読み込み中...</div>
  </div>

<script>
  const STATUS_LABEL = {
    proposed: '提案中',
    accepted: '採用',
    posted: '投稿済み',
    rejected: '却下'
  };

  let allEntries = [];
  let entryById = {};
  let currentFilter = 'all';

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === f);
    });
    render();
  }

  async function loadLog() {
    const btn = document.getElementById('refreshBtn');
    const statusLine = document.getElementById('statusLine');
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = '...更新中';
    try {
      const res = await fetch('./content-log.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('failed to load');
      allEntries = await res.json();
      entryById = {};
      allEntries.forEach(e => { entryById[e.id] = e; });
      render();
      const now = new Date();
      statusLine.textContent = `最終更新: ${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="empty-state">読み込みに失敗しました。時間をおいて再度お試しください。</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  function render() {
    const content = document.getElementById('content');
    const filtered = currentFilter === 'all'
      ? allEntries
      : allEntries.filter(e => e.status === currentFilter);

    if (filtered.length === 0) {
      content.innerHTML = '<div class="empty-state">該当するネタがありません。</div>';
      return;
    }

    // 日付ごとにグループ化(新しい日付順)
    const byDate = {};
    filtered.forEach(e => {
      (byDate[e.date] ||= []).push(e);
    });
    const dates = Object.keys(byDate).sort().reverse();

    content.innerHTML = dates.map(date => `
      <div class="day-group">
        <h2>${date}</h2>
        ${byDate[date].map(cardHtml).join('')}
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    return (s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function cardHtml(e) {
    const statusClass = `status-${e.status}`;
    const statusLabel = STATUS_LABEL[e.status] || e.status;
    const criticNote = e.critic_note
      ? `<div class="critic-note">批評メモ(スコア${e.critic_score ?? '-'}): ${escapeHtml(e.critic_note)}</div>`
      : '';
    return `
      <div class="card">
        <div class="card-top">
          <div class="headline">${escapeHtml(e.headline)}</div>
          <div class="status-badge ${statusClass}">${statusLabel}</div>
        </div>
        <div class="draft-box">${escapeHtml(e.posted_text || e.draft_text)}</div>
        <div class="card-meta"><b>角度:</b> ${escapeHtml(e.angle || '')}</div>
        <div class="card-actions">
          <button class="copy-btn" onclick="copyText(this, '${e.id}')">📋 コピー</button>
          ${e.source ? `<a class="source-link" href="${escapeHtml(e.source)}" target="_blank" rel="noopener">出典</a>` : ''}
        </div>
        ${criticNote}
      </div>
    `;
  }

  async function copyText(btn, id) {
    const entry = entryById[id];
    const text = entry.posted_text || entry.draft_text;
    await navigator.clipboard.writeText(text);
    const original = btn.textContent;
    btn.textContent = '✅ コピーしました';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 2000);
  }

  loadLog();
</script>
</body>
</html>
