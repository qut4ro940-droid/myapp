<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- 上段：横長カード（日付・ヘッダー風） -->
  <rect x="72" y="80" width="368" height="120" rx="20" fill="#ffffff" opacity="0.95"/>
  <!-- 上カード内のライン装飾 -->
  <rect x="104" y="112" width="120" height="16" rx="8" fill="#6366f1" opacity="0.3"/>
  <rect x="104" y="140" width="80" height="12" rx="6" fill="#6366f1" opacity="0.2"/>
  <circle cx="370" cy="140" r="28" fill="#6366f1" opacity="0.15"/>
  <circle cx="370" cy="140" r="16" fill="#6366f1" opacity="0.25"/>

  <!-- 下段左：小カード -->
  <rect x="72" y="228" width="168" height="204" rx="20" fill="#ffffff" opacity="0.95"/>
  <!-- 左カード内の絵文字風丸 -->
  <circle cx="156" cy="300" r="36" fill="#6366f1" opacity="0.12"/>
  <rect x="112" y="352" width="88" height="12" rx="6" fill="#6366f1" opacity="0.2"/>
  <rect x="124" y="374" width="64" height="10" rx="5" fill="#6366f1" opacity="0.15"/>

  <!-- 下段右：小カード -->
  <rect x="272" y="228" width="168" height="204" rx="20" fill="#ffffff" opacity="0.85"/>
  <!-- 右カード内のバー装飾（グラフ風） -->
  <rect x="308" y="368" width="20" height="36" rx="6" fill="#6366f1" opacity="0.3"/>
  <rect x="338" y="344" width="20" height="60" rx="6" fill="#6366f1" opacity="0.45"/>
  <rect x="368" y="320" width="20" height="84" rx="6" fill="#6366f1" opacity="0.6"/>
</svg>
